  /api/v1/messages/:
    get:
      operationId: v1_messages_list
      parameters:
      - in: query
        name: contact
        schema:
          type: string
          format: uuid
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: purpose
        schema:
          type: string
          enum:
          - birthday
          - check_in
          - congratulations
          - custom
          - gratitude
          - reconnect
        description: |-
          * `check_in` - Check-in
          * `birthday` - Birthday
          * `congratulations` - Congratulations
          * `gratitude` - Gratitude
          * `reconnect` - Reconnect
          * `custom` - Custom
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - approved
          - cancelled
          - delivered
          - draft
          - failed
          - queued
          - sent
        description: |-
          * `draft` - Draft
          * `approved` - Approved
          * `queued` - Queued
          * `sent` - Sent
          * `delivered` - Delivered
          * `failed` - Failed
          * `cancelled` - Cancelled
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMessageList'
          description: ''
