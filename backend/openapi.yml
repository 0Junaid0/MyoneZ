      - in: path
        name: contact_pk
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Memory'
          application/x-www-form-urlencoded:
            schema:
