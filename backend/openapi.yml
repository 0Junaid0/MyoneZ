components:
  schemas:
    AnalyticsOverview:
      type: object
      properties:
        active_contacts:
          type: integer
        upcoming_touchpoints:
          type: integer
        overdue_touchpoints:
          type: integer
        contacted_last_30_days:
          type: integer
        activity_trend:
          type: array
          items:
            type: object
            additionalProperties: {}
        delivery_status:
          type: object
          additionalProperties: {}
        recent_interactions:
          type: array
          items:
            type: object
            additionalProperties: {}
      required:
      - active_contacts
      - activity_trend
      - contacted_last_30_days
      - delivery_status
      - overdue_touchpoints
      - recent_interactions
      - upcoming_touchpoints
    BlankEnum:
      enum:
      - ''
    CategoryEnum:
      enum:
      - interest
      - life_event
      - shared_experience
      - discussion
      - plan
      - preference
      - other
      type: string
      description: |-
        * `interest` - Interest
        * `life_event` - Life event
        * `shared_experience` - Shared experience
        * `discussion` - Discussion
        * `plan` - Plan
        * `preference` - Preference
        * `other` - Other
    Contact:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          maxLength: 32
        whatsapp:
          type: string
          maxLength: 32
        telegram:
          type: string
          maxLength: 64
        messenger:
          type: string
          maxLength: 64
        relationship:
          $ref: '#/components/schemas/RelationshipEnum'
        tag_ids:
          type: array
          items:
            type: string
            format: uuid
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
          readOnly: true
        birthday:
          type: string
          format: date
          nullable: true
        timezone:
          type: string
          maxLength: 64
        preferred_channel:
          oneOf:
          - $ref: '#/components/schemas/PreferredChannelEnum'
          - $ref: '#/components/schemas/BlankEnum'
        status:
          $ref: '#/components/schemas/ContactStatusEnum'
        last_contacted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        schedule:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - last_contacted_at
      - name
      - relationship
      - schedule
      - tags
      - updated_at
    ContactStatusEnum:
      enum:
      - active
      - paused
      - archived
      type: string
      description: |-
        * `active` - Active
        * `paused` - Paused
        * `archived` - Archived
    DeliveryAttempt:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        provider:
          type: string
          maxLength: 30
        status:
          $ref: '#/components/schemas/DeliveryAttemptStatusEnum'
        error:
          type: string
          maxLength: 500
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - provider
      - status
    DeliveryAttemptStatusEnum:
      enum:
      - created
      - handed_off
      - sent
      - failed
      type: string
      description: |-
        * `created` - Created
        * `handed_off` - Handed off
        * `sent` - Sent
        * `failed` - Failed
    Device:
      type: object
      properties:
        token:
          type: string
          maxLength: 255
        platform:
          $ref: '#/components/schemas/PlatformEnum'
      required:
      - platform
      - token
    EmailAccount:
      type: object
      properties:
        from_email:
          type: string
          format: email
          maxLength: 254
        host:
          type: string
          maxLength: 255
        port:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        username:
          type: string
          maxLength: 255
        password:
          type: string
          writeOnly: true
        password_set:
          type: string
          readOnly: true
        security:
          $ref: '#/components/schemas/SecurityEnum'
      required:
      - from_email
      - password_set
    Integration:
      type: object
      properties:
