      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerify'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OtpVerify'
          multipart/form-data:
            schema:
