              schema:
                $ref: '#/components/schemas/OtpVerify'
          description: ''
  /api/v1/contacts/:
    get:
      operationId: v1_contacts_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: relationship
        schema:
          type: string
          enum:
          - colleague
          - family
          - friend
          - mentor
          - other
        description: |-
          * `friend` - Friend
          * `family` - Family
          * `colleague` - Colleague
          * `mentor` - Mentor
          * `other` - Other
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - active
          - archived
          - paused
        description: |-
          * `active` - Active
          * `paused` - Paused
          * `archived` - Archived
      - in: query
        name: tags
        schema:
          type: array
          items:
            type: string
            format: uuid
        explode: true
        style: form
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedContactList'
          description: ''
    post:
      operationId: v1_contacts_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Contact'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Contact'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Contact'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
          description: ''
  /api/v1/contacts/{contact_pk}/interactions/:
    get:
      operationId: v1_contacts_interactions_list
      parameters:
      - in: query
        name: channel
        schema:
          type: string
      - in: path
        name: contact_pk
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: kind
        schema:
          type: string
          enum:
          - call
          - custom
          - in_person
          - message
          - occasion
          - video
        description: |-
          * `call` - Phone call
          * `message` - Text/message
          * `in_person` - In-person meeting
          * `video` - Video call
          * `occasion` - Special occasion
          * `custom` - Custom
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: use_for_drafting
        schema:
          type: boolean
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInteractionList'
          description: ''
    post:
      operationId: v1_contacts_interactions_create
      parameters:
      - in: path
        name: contact_pk
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Interaction'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Interaction'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Interaction'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Interaction'
          description: ''
  /api/v1/contacts/{contact_pk}/interactions/{id}/:
