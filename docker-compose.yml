services:
  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api: &app
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-only-unsafe-key-7Zp4vQ9xLm2cN8sT5wR1kF6jH3dB0yG}
      SQLITE_PATH: /data/db.sqlite3
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_COOKIE_SECURE: ${JWT_COOKIE_SECURE:-false}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-false}
      SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-0}
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 1"
    ports:
      - "8000:8000"
    volumes:
      - sqlite_data:/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 15s
      timeout: 5s
      retries: 10

  worker:
    <<: *app
    command: celery -A config worker -l INFO
    ports: []
    healthcheck:
      disable: true

  beat:
    <<: *app
    command: celery -A config beat -l INFO
    ports: []
    healthcheck:
      disable: true

volumes:
  sqlite_data:
  redis_data:
